name: build-name-me
on:
  create:
    tags:
      - ^v\d{1,}\.\d{1,}\.\d{1,}$

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_REGISTRY: ghcr.io/wouldgo
      DOCKER_IMAGE: name-dot-com-updater
      DOCKER_TARGET_PLATFORM: linux/arm64,linux/amd64
    steps:
      -
        id: checkout
        name: Checkout the code
        uses: actions/checkout@v4

      -
        id: install-buildx
        name: Set up Docker Buildx
        uses: docker/setup-qemu-action@v3

      -
        id: setup-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        id: login-registry
        name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        id: get-tag
        name: Get tag version
        run: echo "TAG=$(git tag --points-at HEAD | sed 's/v//g')" >> "$GITHUB_ENV"

      -
        id: build
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.DOCKER_TARGET_PLATFORM }}
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.TAG }}
